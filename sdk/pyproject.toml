[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "datapanel-agent-examples"
version = "0.1.0"
description = "A tested DataPanel cookbook for Codex: discover, compute, export, and verify."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "mcp>=1.28,<2"]

[project.scripts]
datapanel-demo = "datapanel_agent.cli:main"
datapanel-mcp = "datapanel_agent.mcp_server:main"
datapanel-train = "datapanel_agent.training:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["core: optional contract tests against a local DataPanel Core checkout"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
